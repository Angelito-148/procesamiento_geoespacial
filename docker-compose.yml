# archivo: docker-compose.yml   
name: geo

x-mongo-env: &mongo-env
  MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
  MONGO_DB: geodb
  MONGO_COLLECTION: eventos

services:
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Falta MONGO_PASSWORD en .env}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  
  dask-scheduler:
    build: ./ingest
    image: geo/dask:latest
    command: dask scheduler --dashboard-address :8787
    ports:
      - "8787:8787"            # panel web de Dask

  # ...y workers que lo ejecutan (2 réplicas = 2 contenedores)
  dask-worker:
    build: ./ingest
    image: geo/dask:latest
    command: dask worker tcp://dask-scheduler:8786 --nthreads 2 --memory-limit 2GB
    depends_on:
      - dask-scheduler
    volumes:
      - data:/data               # los workers leen el CSV y escriben el Parquet
    deploy:
      replicas: 2

  # Trabajo de ingesta: API de Kaggle + limpieza + carga
  ingest:
    build: ./ingest
    image: geo/dask:latest
    profiles: ["jobs"]
    env_file: [config.env]
    environment:
      <<: *mongo-env
      DASK_SCHEDULER: tcp://dask-scheduler:8786
    volumes:
      - data:/data
    depends_on:
      mongo:
        condition: service_healthy
      dask-scheduler:
        condition: service_started
    command: ["sh", "-c", "python download.py && python clean_load.py"]

volumes:
  mongo_data:
  data: