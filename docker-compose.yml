# archivo: docker-compose.yml
name: geo

x-mongo-env: &mongo-env
  MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
  MONGO_DB: geodb
  MONGO_COLLECTION: eventos

services:
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Falta MONGO_PASSWORD en .env}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  dask-scheduler:
    build: ./ingest
    image: geo/dask:latest
    command: dask scheduler --dashboard-address :8787
    ports:
      - "8787:8787"

  dask-worker:
    build: ./ingest
    image: geo/dask:latest
    command: dask worker tcp://dask-scheduler:8786 --nthreads 2 --memory-limit 2GB
    depends_on:
      - dask-scheduler
    volumes:
      - data:/data
    deploy:
      replicas: 2

  ingest:
    build: ./ingest
    image: geo/dask:latest
    profiles: ["jobs"]
    env_file: [config.env]
    environment:
      <<: *mongo-env
      DASK_SCHEDULER: tcp://dask-scheduler:8786
    volumes:
      - data:/data
    depends_on:
      mongo:
        condition: service_healthy
      dask-scheduler:
        condition: service_started
    command: ["sh", "-c", "python download.py && python clean_load.py"]

  # Spark: master que coordina...
  spark-master:
    build: ./spark
    image: geo/spark:latest
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      <<: *mongo-env
    ports:
      - "8081:8080"            # panel de Spark (el 8080 lo usará Jenkins)
    volumes:
      - data:/data

  # ...y worker que ejecuta
  spark-worker:
    build: ./spark
    image: geo/spark:latest
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g
    depends_on:
      - spark-master
    volumes:
      - data:/data
    deploy:
      replicas: 1

volumes:
  mongo_data:
  data: