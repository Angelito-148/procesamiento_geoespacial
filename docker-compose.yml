# archivo: docker-compose.yml   (versión de la Fase 4)
name: geo

x-mongo-env: &mongo-env
  MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
  MONGO_DB: geodb
  MONGO_COLLECTION: eventos

services:
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Falta MONGO_PASSWORD en .env}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ingest:
    build: ./ingest
    image: geo/dask:latest
    profiles: ["jobs"]          # no arranca con "up"; se ejecuta con "docker compose run"
    env_file: [config.env]
    environment:
      <<: *mongo-env
    volumes:
      - data:/data
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  data: